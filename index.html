<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Performance Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h1>Student Performance Dashboard</h1>

  <!-- Controls -->
  <div class="controls">
    <input type="text" id="searchInput" placeholder="Enter student name">

    <select id="blockFilter">
      <option value="All">All Blocks</option>
      <option value="31-ITE-01">31-ITE-01</option>
      <option value="31-ITE-02">31-ITE-02</option>
      <option value="31-ITE-03">31-ITE-03</option>
    </select>

    <select id="statusFilter">
      <option value="All">All Status</option>
      <option value="Excellent">Excellent</option>
      <option value="Passed">Passed</option>
      <option value="Needs Improvement">Needs Improvement</option>
      <option value="Failed">Failed</option>
    </select>

    <button id="applyBtn">Apply Filters</button>
    <button id="resetBtn">Reset</button>
  </div>

  <!-- Summary -->
  <div class="summary">
    <p>Class Average: <span id="classAverage">0.00</span></p>
    <p>Passing Count: <span id="passingCount">0</span></p>
    <p>Displayed Students: <span id="displayedCount">0</span></p>
    <p>Top Student: <span id="topStudent">—</span></p>
  </div>

  <!-- Message Area -->
  <div id="messageArea" class="message"></div>

  <!-- Student Cards -->
  <div id="studentList" class="student-grid"></div>

  <!-- ES Modules -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
